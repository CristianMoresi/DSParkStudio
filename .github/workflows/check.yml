name: Distribution repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # No private runner minutes while the owner prepares this repository.
    if: github.repository == 'CristianMoresi/DSParkStudio' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 .github/scripts/check_repository.py
      - run: python3 .github/scripts/test_distribution.py
